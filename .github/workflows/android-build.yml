name: Android Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :sharedUI:jvmTest --no-daemon

      - name: Compile the shared module for the JVM and the web
        run: ./gradlew :sharedUI:compileKotlinJvm :sharedUI:compileKotlinWasmJs --no-daemon

      - name: Assemble the release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikiscroll-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: androidApp/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
